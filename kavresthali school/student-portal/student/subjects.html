<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects & Grades | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        @media print {
            .portal-sidebar, .sidebar-toggle, .sidebar-overlay,
            .portal-bg-blob, .top-header .print-hide, #printBtn,
            .card-header a, .login-overlay { display: none !important; }
            .portal-layout { display: block !important; }
            .portal-main { margin-left: 0 !important; padding: 0 !important; }
            body { background: #fff !important; color: #000 !important; }
            .card { background: #fff !important; border: 1px solid #ddd !important; box-shadow: none !important; }
            .card-header { background: #f5f5f5 !important; }
            .badge { background: #eee !important; color: #333 !important; border: 1px solid #ccc !important; }
            .print-report-header { display: block !important; }
        }
        .print-report-header { display: none; text-align:center; padding: 16px 0 8px; border-bottom: 2px solid #333; margin-bottom: 16px; }
        .print-report-header h2 { font-size: 20px; margin-bottom: 4px; }
        .print-report-header p  { font-size: 13px; color: #555; }
        .grade-bar {
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            margin-top: 4px;
            overflow: hidden;
        }
        .grade-bar-fill { height: 100%; border-radius: 3px; background: var(--cyan); }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'subjects',
            onReady: (main) => {
                // Always read live grades from storage
                const currentGrades = getStoredGrades().filter(g => g.studentId === 'STU-10A-007');
                const liveGPA = calculateStudentGPA('STU-10A-007');
                const totalMarks = currentGrades.reduce((a, g) => a + g.total, 0);
                const maxMarks = currentGrades.length * 100;

                let rows = currentGrades.map(g => {
                    const sub = SUBJECTS_C10.find(s => s.code === g.subjectCode);
                    const teacherName = sub ? getTeacherName(sub.teacher) : 'Faculty';
                    const credit = sub ? sub.credit : 4;
                    const pct = g.total;
                    const barColor = g.total >= 90 ? 'var(--cyan)' : g.total >= 80 ? 'var(--emerald)' : g.total >= 70 ? 'var(--gold)' : 'var(--rose)';
                    return `
                        <tr>
                            <td>
                                <strong>${sub ? sub.name : g.subjectCode}</strong><br>
                                <span style="font-size:11px; color:var(--text-muted);">${g.subjectCode} • ${credit} Credits</span>
                                <div class="grade-bar"><div class="grade-bar-fill" style="width:${pct}%; background:${barColor};"></div></div>
                            </td>
                            <td>${teacherName}</td>
                            <td>${g.internal} / ${g.internalMax}</td>
                            <td>${g.external} / ${g.externalMax}</td>
                            <td><strong>${g.total} / 100</strong></td>
                            <td><span class="badge ${g.gradeClass}">${g.grade} (${g.gpa.toFixed(1)})</span></td>
                        </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Subjects & Grade Sheet</h1>
                            <p>Class 10 — First Terminal Marks & Academic Assessment — ${getNepaliDate()}</p>
                        </div>
                        <button id="printBtn" onclick="window.print()" class="login-btn" style="padding:10px 20px; font-size:13px;"><i class='bx bx-printer'></i> Print Report Card</button>
                    </div>

                    <!-- Print-only header -->
                    <div class="print-report-header">
                        <h2>Kavresthali Secondary School — Grade Report Card</h2>
                        <p>Student: Damodar Dhakal | Class: 10A | Roll: 7 | ID: STU-10A-007</p>
                        <p>First Terminal Examination 2083</p>
                    </div>

                    <div class="grid grid-3 fade-in" style="margin-bottom:24px;">
                        <div class="stat-card">
                            <div class="stat-icon icon-cyan"><i class='bx bx-bar-chart-alt-2'></i></div>
                            <div class="stat-value">${liveGPA}</div>
                            <div class="stat-label">Cumulative GPA</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-emerald"><i class='bx bx-check-circle'></i></div>
                            <div class="stat-value">${totalMarks} / ${maxMarks}</div>
                            <div class="stat-label">Total Marks Obtained</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-gold"><i class='bx bx-book-open'></i></div>
                            <div class="stat-value">${currentGrades.length}</div>
                            <div class="stat-label">Subjects Assessed</div>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-book-open' style="color:var(--cyan);"></i> Enrolled Courses (${currentGrades.length} Subjects)</span>
                            <span style="font-weight:700; color:var(--cyan); font-size:16px;">Overall GPA: ${liveGPA}</span>
                        </div>
                        <div style="overflow-x:auto;">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Subject</th>
                                        <th>Teacher</th>
                                        <th>Internal (40)</th>
                                        <th>External (60)</th>
                                        <th>Total (100)</th>
                                        <th>Grade (GPA)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
