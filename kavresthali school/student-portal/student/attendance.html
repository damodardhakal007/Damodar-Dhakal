<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'attendance',
            onReady: (main) => {
                const att = MY_ATTENDANCE;
                const month = att.monthly['Bhadra 2083'];
                
                let calendarDays = '';
                // Empty padding for start day
                for (let i = 0; i < month.startDay; i++) {
                    calendarDays += `<div style="padding:12px; background:rgba(255,255,255,0.01); border-radius:8px;"></div>`;
                }
                month.days.forEach((status, idx) => {
                    let cls = 'bg-present';
                    let label = 'P';
                    if (status === 'A') { cls = 'bg-absent'; label = 'A'; }
                    else if (status === 'L') { cls = 'bg-late'; label = 'L'; }
                    else if (status === 'H') { cls = 'bg-holiday'; label = 'H'; }
                    calendarDays += `
                        <div style="padding:10px 4px; text-align:center; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);">
                            <div style="font-size:11px; color:var(--text-muted);">${idx + 1}</div>
                            <span class="attendance-tag ${cls}" style="margin-top:4px;">${label}</span>
                        </div>
                    `;
                });

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Attendance Overview</h1>
                            <p>Academic Year 2083 — Class 10A Attendance Record</p>
                        </div>
                    </div>

                    <div class="grid grid-3 fade-in" style="margin-bottom:24px;">
                        <div class="card" style="display:flex; align-items:center; gap:20px;">
                            <div class="progress-ring-container">
                                <svg class="ring-svg" width="90" height="90" viewBox="0 0 100 100">
                                    <circle class="ring-bg" cx="50" cy="50" r="42"/>
                                    <circle class="ring-fill" cx="50" cy="50" r="42" style="stroke-dasharray: 263.89; stroke-dashoffset: ${263.89 * (1 - att.percentage/100)}; stroke: var(--cyan);"/>
                                </svg>
                                <div class="ring-text" style="font-size:18px;">${att.percentage}%</div>
                            </div>
                            <div>
                                <div style="font-size:13px; color:var(--text-muted);">Overall Rate</div>
                                <div style="font-size:22px; font-weight:800; color:var(--cyan); margin-top:2px;">Excellent</div>
                                <div style="font-size:11px; color:var(--text-muted);">Min required: 75%</div>
                            </div>
                        </div>

                        <div class="card" style="display:flex; align-items:center; justify-content:space-around; text-align:center;">
                            <div>
                                <div style="font-size:28px; font-weight:800; color:var(--emerald);">${att.present}</div>
                                <div style="font-size:12px; color:var(--text-muted);">Days Present</div>
                            </div>
                            <div style="width:1px; height:40px; background:rgba(255,255,255,0.08);"></div>
                            <div>
                                <div style="font-size:28px; font-weight:800; color:var(--rose);">${att.absent}</div>
                                <div style="font-size:12px; color:var(--text-muted);">Days Absent</div>
                            </div>
                            <div style="width:1px; height:40px; background:rgba(255,255,255,0.08);"></div>
                            <div>
                                <div style="font-size:28px; font-weight:800; color:var(--amber);">${att.late}</div>
                                <div style="font-size:12px; color:var(--text-muted);">Days Late</div>
                            </div>
                        </div>

                        <div class="card">
                            <div style="font-size:13px; font-weight:700; margin-bottom:8px;">Legend</div>
                            <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                                <div><span class="attendance-tag bg-present">P</span> Present</div>
                                <div><span class="attendance-tag bg-absent">A</span> Absent</div>
                                <div><span class="attendance-tag bg-late">L</span> Late</div>
                                <div><span class="attendance-tag bg-holiday">H</span> Holiday / Weekend</div>
                            </div>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-calendar' style="color:var(--cyan);"></i> Monthly Calendar — Bhadra 2083</span>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; text-align:center; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:12px;">
                            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:8px;">
                            ${calendarDays}
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
