<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Teacher Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'teacher',
            pageId: 'attendance',
            onReady: (main) => {
                const allStudents = getStoredStudents();

                function getRowsForClass(classId) {
                    const filtered = allStudents.filter(s => s.classId === classId);
                    if (filtered.length === 0) {
                        return '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-muted);">No students enrolled in this section.</td></tr>';
                    }
                    return filtered.map((s) => `
                        <tr>
                            <td>${s.roll}</td>
                            <td><strong>${s.name}</strong></td>
                            <td><code>${s.id}</code></td>
                            <td>
                                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                                    <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                        <input type="radio" name="att_${s.id}" value="P" checked> <span class="attendance-tag bg-present">Present</span>
                                    </label>
                                    <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                        <input type="radio" name="att_${s.id}" value="A"> <span class="attendance-tag bg-absent">Absent</span>
                                    </label>
                                    <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                        <input type="radio" name="att_${s.id}" value="L"> <span class="attendance-tag bg-late">Late</span>
                                    </label>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }

                function renderSavedRecords() {
                    const records = getStoredAttendanceRecords();
                    if (records.length === 0) {
                        return '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">No attendance records saved yet.</div>';
                    }
                    // Group by date+class
                    const grouped = {};
                    records.forEach(r => {
                        const key = `${r.date}|${r.classId}`;
                        if (!grouped[key]) grouped[key] = { date: r.date, classId: r.classId, entries: [] };
                        grouped[key].entries.push(r);
                    });
                    return Object.values(grouped).slice(0, 5).map(g => {
                        const cls = CLASSES.find(c => c.id === g.classId);
                        const clsName = cls ? `${cls.name} ${cls.section}` : g.classId;
                        const present = g.entries.filter(e => e.status === 'P').length;
                        const absent  = g.entries.filter(e => e.status === 'A').length;
                        const late    = g.entries.filter(e => e.status === 'L').length;
                        const pct     = Math.round((present / g.entries.length) * 100);
                        return `
                        <div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                            <div>
                                <div style="font-weight:700; font-size:13px;">${clsName}</div>
                                <div style="font-size:11px; color:var(--text-muted);"><i class='bx bx-calendar'></i> ${g.date}</div>
                            </div>
                            <div style="display:flex; gap:12px; font-size:12px;">
                                <span style="color:var(--emerald);">✓ ${present} Present</span>
                                <span style="color:var(--rose);">✗ ${absent} Absent</span>
                                <span style="color:var(--amber);">⚑ ${late} Late</span>
                                <span style="font-weight:700; color:var(--cyan);">${pct}%</span>
                            </div>
                        </div>
                        `;
                    }).join('');
                }

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Mark Daily Attendance</h1>
                            <p>Select class section, date, and record student attendance — saves to system</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Select Class</label>
                            <select id="classSelect" class="gpa-select" style="width:160px;">
                                ${CLASSES.map(c => `<option value="${c.id}" ${c.id === 'C10A' ? 'selected' : ''}>${c.name} - Sec ${c.section}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Date</label>
                            <input type="date" id="attDate" value="${new Date().toISOString().split('T')[0]}" class="gpa-select" style="width:170px;">
                        </div>
                        <div style="display:flex; gap:8px; margin-left:auto; flex-wrap:wrap;">
                            <button onclick="markAll('P')" style="background:rgba(0,255,157,0.12); border:1px solid rgba(0,255,157,0.3); color:var(--emerald); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12px; font-family:inherit;"><i class='bx bx-check-circle'></i> Mark All Present</button>
                            <button onclick="saveAttendanceRecord()" class="login-btn" style="padding:10px 24px; font-size:13px;"><i class='bx bx-check-circle'></i> Save Attendance Sheet</button>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title" id="rosterTitle"><i class='bx bx-group' style="color:var(--emerald);"></i> Class Roster</span>
                            <span id="attSummary" style="font-size:12px; color:var(--text-muted);"></span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Roll</th><th>Student Name</th><th>Student ID</th><th>Attendance Status</th></tr>
                            </thead>
                            <tbody id="attTableBody">
                                ${getRowsForClass('C10A')}
                            </tbody>
                        </table>
                    </div>

                    <div class="card fade-in" style="margin-top:24px;">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-history' style="color:var(--gold);"></i> Recent Attendance Records</span>
                        </div>
                        <div id="savedRecordsList">
                            ${renderSavedRecords()}
                        </div>
                    </div>
                `;

                const sel   = document.getElementById('classSelect');
                const tbody = document.getElementById('attTableBody');
                const title = document.getElementById('rosterTitle');

                function updateSummary() {
                    const rows = [...tbody.querySelectorAll('tr[data-stu-id]')];
                    const total = tbody.querySelectorAll('tr').length;
                    const present = [...document.querySelectorAll('input[value="P"]:checked')].length;
                    const absent  = [...document.querySelectorAll('input[value="A"]:checked')].length;
                    const late    = [...document.querySelectorAll('input[value="L"]:checked')].length;
                    document.getElementById('attSummary').textContent = `Present: ${present} | Absent: ${absent} | Late: ${late}`;
                }

                function updateClass() {
                    const selectedC = CLASSES.find(c => c.id === sel.value);
                    const name = selectedC ? `${selectedC.name} Sec ${selectedC.section}` : sel.value;
                    title.innerHTML = `<i class='bx bx-group' style="color:var(--emerald);"></i> ${name} Student Roster`;
                    tbody.innerHTML = getRowsForClass(sel.value);
                    tbody.addEventListener('change', updateSummary);
                    updateSummary();
                }

                sel.addEventListener('change', updateClass);
                tbody.addEventListener('change', updateSummary);
                updateClass();

                window.markAll = function(status) {
                    document.querySelectorAll(`input[value="${status}"]`).forEach(r => r.checked = true);
                    updateSummary();
                };

                // FIX: Actually persist attendance records to localStorage
                window.saveAttendanceRecord = function() {
                    const classId = sel.value;
                    const dateVal = document.getElementById('attDate').value;
                    const cls     = CLASSES.find(c => c.id === classId);
                    const clsName = cls ? `${cls.name} ${cls.section}` : classId;
                    const students = allStudents.filter(s => s.classId === classId);

                    let records = getStoredAttendanceRecords();

                    // Remove old entries for same class+date (replace)
                    records = records.filter(r => !(r.classId === classId && r.date === dateVal));

                    students.forEach(s => {
                        const radios = document.querySelectorAll(`input[name="att_${s.id}"]`);
                        let status = 'P';
                        radios.forEach(r => { if (r.checked) status = r.value; });
                        records.push({ classId, date: dateVal, studentId: s.id, studentName: s.name, status });
                    });

                    saveAttendanceRecords(records);

                    const present = students.filter(s => {
                        const r = document.querySelector(`input[name="att_${s.id}"]:checked`);
                        return r && r.value === 'P';
                    }).length;
                    const total = students.length;

                    document.getElementById('savedRecordsList').innerHTML = renderSavedRecords();
                    alert(`✅ Attendance saved for ${clsName} on ${dateVal}!\n${present}/${total} students present.`);
                };
            }
        });
    </script>
</body>
</html>
