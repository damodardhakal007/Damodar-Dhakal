<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard | KSS Portal</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'parent',
            pageId: 'dashboard',
            onReady: (main) => {
                const currentStudents = getStoredStudents();
                const wardMatch = CURRENT_USER && CURRENT_USER.wardName ? currentStudents.find(s => s.name.toLowerCase().includes(CURRENT_USER.wardName.toLowerCase())) : null;
                const child = wardMatch || currentStudents.find(s => s.id === USERS.parent.childId) || currentStudents[6];
                const liveGPA = calculateStudentGPA(child.id);
                const childGrades = getStoredGrades().filter(g => g.studentId === child.id);
                const currentMessages = getStoredMessages();
                
                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Welcome, Parent! 👨‍👩‍👧</h1>
                            <p>Monitoring Academic Progress for <strong>${child.name}</strong> — Class 10A</p>
                        </div>
                    </div>

                    <div class="profile-card fade-in" style="margin-bottom:24px; border:1px solid rgba(168,85,247,0.3);">
                        <div class="profile-avatar" style="background:rgba(168,85,247,0.15); border-color:var(--violet); color:var(--violet);"><i class='bx bxs-user'></i></div>
                        <div class="profile-details">
                            <h2>${child.name}</h2>
                            <p class="role-badge" style="color:var(--violet);">Student ID: ${child.id} • Roll No: ${child.roll} • Class 10A</p>
                            <p><i class='bx bx-building-house'></i> School: ${SCHOOL.name}</p>
                            <p><i class='bx bx-user'></i> Class Teacher: Ram Bahadur Sharma</p>
                        </div>
                    </div>

                    <div class="grid grid-3 fade-in" style="margin-bottom:24px;">
                        <div class="stat-card">
                            <div class="stat-icon" style="background:rgba(168,85,247,0.15); color:var(--violet);"><i class='bx bx-bar-chart-alt-2'></i></div>
                            <div class="stat-value" style="color:var(--violet);">${liveGPA}</div>
                            <div class="stat-label">Current GPA (CDC Standard)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-emerald"><i class='bx bx-calendar-check'></i></div>
                            <div class="stat-value">${MY_ATTENDANCE.percentage}%</div>
                            <div class="stat-label">Attendance Rate (108 Days)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-gold"><i class='bx bx-message-dots'></i></div>
                            <div class="stat-value">${currentMessages.length}</div>
                            <div class="stat-label">Teacher Messages</div>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-line-chart' style="color:var(--violet);"></i> Terminal Marks Overview</span>
                                <a href="progress.html" class="badge badge-subtle">Detailed Progress</a>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:12px;">
                                ${childGrades.slice(0, 4).map(g => `
                                    <div>
                                        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
                                            <span><strong>${getSubjectName(g.subjectCode)}</strong></span>
                                            <span><strong>${g.total} / 100</strong> (${g.grade})</span>
                                        </div>
                                        <div style="height:6px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden;">
                                            <div style="height:100%; width:${g.total}%; background:var(--violet); border-radius:3px;"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-message-detail' style="color:var(--gold);"></i> Latest Teacher Remarks</span>
                                <a href="messages.html" class="badge badge-subtle">View All</a>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:12px;">
                                ${currentMessages.slice(0, 2).map(m => `
                                    <div style="padding:12px; background:rgba(255,255,255,0.03); border-radius:10px; border-left:3px solid var(--violet);">
                                        <div style="font-size:12px; font-weight:700; color:var(--violet);">${m.from}</div>
                                        <div style="font-size:12px; color:var(--text-secondary); margin:4px 0;">${m.message}</div>
                                        <div style="font-size:10px; color:var(--text-muted);">${m.date}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
