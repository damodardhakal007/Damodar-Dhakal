<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Parent Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'parent',
            pageId: 'attendance',
            onReady: (main) => {
                const att = MY_ATTENDANCE;
                const month = att.monthly['Bhadra 2083'];
                
                let calendarDays = '';
                for (let i = 0; i < month.startDay; i++) {
                    calendarDays += `<div style="padding:12px; background:rgba(255,255,255,0.01); border-radius:8px;"></div>`;
                }
                month.days.forEach((status, idx) => {
                    let cls = 'bg-present';
                    let label = 'P';
                    if (status === 'A') { cls = 'bg-absent'; label = 'A'; }
                    else if (status === 'L') { cls = 'bg-late'; label = 'L'; }
                    else if (status === 'H') { cls = 'bg-holiday'; label = 'H'; }
                    calendarDays += `
                        <div style="padding:10px 4px; text-align:center; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);">
                            <div style="font-size:11px; color:var(--text-muted);">${idx + 1}</div>
                            <span class="attendance-tag ${cls}" style="margin-top:4px;">${label}</span>
                        </div>
                    `;
                });

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Child's Attendance Record</h1>
                            <p>Daily Attendance & Monthly Summary for Damodar Dhakal</p>
                        </div>
                    </div>

                    <div class="grid grid-3 fade-in" style="margin-bottom:24px;">
                        <div class="card" style="text-align:center; padding:20px;">
                            <div style="font-size:12px; color:var(--text-muted);">Days Present</div>
                            <div style="font-size:36px; font-weight:800; color:var(--emerald); margin-top:4px;">${att.present}</div>
                        </div>
                        <div class="card" style="text-align:center; padding:20px;">
                            <div style="font-size:12px; color:var(--text-muted);">Days Absent</div>
                            <div style="font-size:36px; font-weight:800; color:var(--rose); margin-top:4px;">${att.absent}</div>
                        </div>
                        <div class="card" style="text-align:center; padding:20px;">
                            <div style="font-size:12px; color:var(--text-muted);">Days Late</div>
                            <div style="font-size:36px; font-weight:800; color:var(--amber); margin-top:4px;">${att.late}</div>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-calendar' style="color:var(--violet);"></i> Attendance Calendar — Bhadra 2083</span>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; text-align:center; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:12px;">
                            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:8px;">
                            ${calendarDays}
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
