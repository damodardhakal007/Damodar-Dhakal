<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices | Admin Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'admin',
            pageId: 'notices',
            onReady: (main) => {
                let currentNotices = getStoredNotices();

                const typeColors = {
                    exam:    { bg: 'rgba(251,113,133,0.12)', color: 'var(--rose)',    border: 'rgba(251,113,133,0.3)' },
                    fee:     { bg: 'rgba(255,215,0,0.12)',   color: 'var(--gold)',    border: 'rgba(255,215,0,0.3)' },
                    event:   { bg: 'rgba(192,132,252,0.12)', color: 'var(--violet)',  border: 'rgba(192,132,252,0.3)' },
                    general: { bg: 'rgba(0,255,157,0.10)',   color: 'var(--emerald)', border: 'rgba(0,255,157,0.3)' },
                };

                let renderAdminNotices = () => {
                    if (currentNotices.length === 0) {
                        return '<div class="card" style="text-align:center; padding:40px; color:var(--text-muted);"><i class=\'bx bx-bell-off\' style="font-size:48px; opacity:0.3;"></i><p style="margin-top:12px;">No announcements published yet.</p></div>';
                    }
                    return currentNotices.map(n => {
                        const tc = typeColors[n.type] || typeColors.general;
                        return `
                        <div class="card notice-card fade-in" style="margin-bottom:16px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
                                <div>
                                    <span style="display:inline-block; margin-bottom:8px; padding:3px 10px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; background:${tc.bg}; color:${tc.color}; border:1px solid ${tc.border};">${n.type}</span>
                                    <h3 style="margin-bottom:6px; font-size:16px; line-height:1.4;">${n.title}</h3>
                                </div>
                                <span style="font-size:12px; color:var(--text-muted); white-space:nowrap;"><i class='bx bx-calendar'></i> ${n.date}</span>
                            </div>
                            <p style="color:var(--text-secondary); font-size:13px; margin:8px 0 12px; line-height:1.6;">${n.detail}</p>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.06); padding-top:8px; font-size:11px; color:var(--text-muted);">
                                <span>Author: <strong>${n.author}</strong></span>
                                <button onclick="deleteNotice('${n.id}')" style="background:none; border:none; color:var(--rose); cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:4px; font-family:inherit;"><i class='bx bx-trash'></i> Delete</button>
                            </div>
                        </div>
                    `;}).join('');
                };

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Notice Board Management</h1>
                            <p>Publish and manage school announcements for Students, Parents, and Staff</p>
                        </div>
                        <button onclick="toggleNoticeForm()" class="login-btn" style="padding:10px 20px; font-size:13px;"><i class='bx bx-plus-circle'></i> Publish New Notice</button>
                    </div>

                    <div id="noticeFormCard" class="card fade-in" style="display:none; margin-bottom:24px; border:1px solid var(--gold);">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-plus-circle' style="color:var(--gold);"></i> Publish Official Announcement</span>
                        </div>
                        <form id="newNoticeForm" style="display:flex; flex-direction:column; gap:14px;">
                            <div>
                                <label style="font-size:12px; color:var(--text-muted);">Notice Title *</label>
                                <input type="text" id="nTitle" required class="gpa-select" style="width:100%;" placeholder="e.g. SEE Examination Centers & Guidelines">
                            </div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px;">
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Category / Type</label>
                                    <select id="nType" class="gpa-select" style="width:100%;">
                                        <option value="exam">Examination</option>
                                        <option value="fee">Fee Notice</option>
                                        <option value="event">Event / Activity</option>
                                        <option value="general">General Notice</option>
                                    </select>
                                </div>
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Issuing Department / Author</label>
                                    <input type="text" id="nAuthor" value="Administration" required class="gpa-select" style="width:100%;">
                                </div>
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Date (auto-set today)</label>
                                    <input type="text" id="nDate" class="gpa-select" style="width:100%;" value="${getNepaliDate()}" readonly style="opacity:0.7;">
                                </div>
                            </div>
                            <div>
                                <label style="font-size:12px; color:var(--text-muted);">Notice Detail Content *</label>
                                <textarea id="nDetail" required class="gpa-select" style="width:100%; height:90px; font-family:inherit; resize:vertical;" placeholder="Enter notice details..."></textarea>
                            </div>
                            <div style="display:flex; justify-content:flex-end; gap:10px;">
                                <button type="button" onclick="toggleNoticeForm()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit;">Cancel</button>
                                <button type="submit" class="login-btn" style="padding:8px 20px; font-size:12px;">Publish Notice</button>
                            </div>
                        </form>
                    </div>

                    <div id="noticesList">
                        ${renderAdminNotices()}
                    </div>
                `;

                window.toggleNoticeForm = function() {
                    const c = document.getElementById('noticeFormCard');
                    const showing = c.style.display !== 'none';
                    c.style.display = showing ? 'none' : 'block';
                    if (!showing) c.scrollIntoView({ behavior: 'smooth' });
                };

                document.getElementById('newNoticeForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    // FIX: use Date.now() for collision-safe IDs; auto-date from getNepaliDate()
                    const newN = {
                        id: Date.now(),
                        title: document.getElementById('nTitle').value.trim(),
                        type: document.getElementById('nType').value,
                        author: document.getElementById('nAuthor').value.trim(),
                        detail: document.getElementById('nDetail').value.trim(),
                        date: getNepaliDate()
                    };
                    currentNotices.unshift(newN);
                    saveNotices(currentNotices);
                    document.getElementById('noticesList').innerHTML = renderAdminNotices();
                    alert('Notice published and synced to all Student & Parent portals!');
                    e.target.reset();
                    document.getElementById('nDate').value = getNepaliDate();
                    document.getElementById('nAuthor').value = 'Administration';
                    toggleNoticeForm();
                });

                window.deleteNotice = function(id) {
                    const n = currentNotices.find(x => String(x.id) === String(id));
                    if (confirm(`Delete notice "${n ? n.title : id}"?`)) {
                        currentNotices = currentNotices.filter(n => String(n.id) !== String(id));
                        saveNotices(currentNotices);
                        document.getElementById('noticesList').innerHTML = renderAdminNotices();
                    }
                };
            }
        });
    </script>
</body>
</html>
