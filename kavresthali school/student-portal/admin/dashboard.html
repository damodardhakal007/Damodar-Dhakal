<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KSS Portal</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'admin',
            pageId: 'dashboard',
            onReady: (main) => {
                // FIX: use actual stored student count, not approximate class rosters
                const allStudents = getStoredStudents();
                const totalStudentsCount = allStudents.length;
                const totalNotices = getStoredNotices().length;

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>School Overview & Admin Control 🛡️</h1>
                            <p>Kavresthali Secondary School — ${getDayName()}, ${getNepaliDate()} — Principal: Bishnu P. Gautam</p>
                        </div>
                    </div>

                    <div class="grid grid-4 fade-in" style="margin-bottom:24px;">
                        <div class="stat-card">
                            <div class="stat-icon icon-gold"><i class='bx bx-group'></i></div>
                            <div class="stat-value" id="aStudents">${totalStudentsCount}</div>
                            <div class="stat-label">Registered Students</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-cyan"><i class='bx bx-id-card'></i></div>
                            <div class="stat-value" id="aTeachers">${TEACHERS.length}</div>
                            <div class="stat-label">Faculty Members</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-emerald"><i class='bx bx-building-house'></i></div>
                            <div class="stat-value" id="aClasses">${CLASSES.length}</div>
                            <div class="stat-label">Active Class Sections</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon icon-rose"><i class='bx bx-bell'></i></div>
                            <div class="stat-value" id="aNotices">${totalNotices}</div>
                            <div class="stat-label">Published Notices</div>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in" style="margin-bottom:24px;">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-info-circle' style="color:var(--gold);"></i> School Information</span>
                            </div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">School Name</div>
                                    <div style="font-weight:700; margin-top:2px;">${SCHOOL.name}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Established</div>
                                    <div style="font-weight:700; margin-top:2px;">${SCHOOL.established}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Location</div>
                                    <div style="font-weight:600; margin-top:2px;">${SCHOOL.address}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Contact Phone</div>
                                    <div style="font-weight:600; margin-top:2px;">${SCHOOL.phone}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Email</div>
                                    <div style="font-weight:600; margin-top:2px;">${SCHOOL.email}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Principal</div>
                                    <div style="font-weight:600; margin-top:2px;">${SCHOOL.principal}</div>
                                </div>
                                <div style="grid-column: span 2;">
                                    <div style="font-size:12px; color:var(--text-muted);">School Motto</div>
                                    <div style="font-weight:700; color:var(--gold); margin-top:2px;">"${SCHOOL.motto}"</div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-slider-alt' style="color:var(--cyan);"></i> Management Tools</span>
                            </div>
                            <div class="quick-actions-grid">
                                <a href="students.html" class="quick-action-item">
                                    <i class='bx bx-group' style="color:var(--gold);"></i>
                                    <span>Students</span>
                                </a>
                                <a href="teachers.html" class="quick-action-item">
                                    <i class='bx bx-id-card' style="color:var(--cyan);"></i>
                                    <span>Teachers</span>
                                </a>
                                <a href="classes.html" class="quick-action-item">
                                    <i class='bx bx-building-house' style="color:var(--emerald);"></i>
                                    <span>Classes</span>
                                </a>
                                <a href="reports.html" class="quick-action-item">
                                    <i class='bx bx-line-chart' style="color:var(--rose);"></i>
                                    <span>Reports</span>
                                </a>
                                <a href="notices.html" class="quick-action-item">
                                    <i class='bx bx-bell' style="color:var(--violet);"></i>
                                    <span>Notices</span>
                                </a>
                                <a href="administration.html" class="quick-action-item">
                                    <i class='bx bx-spreadsheet' style="color:var(--gold);"></i>
                                    <span>Administration</span>
                                </a>
                                <a href="../student/dashboard.html" class="quick-action-item">
                                    <i class='bx bxs-graduation' style="color:var(--sapphire);"></i>
                                    <span>Student View</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-bell' style="color:var(--gold);"></i> Recent School Announcements</span>
                            <a href="notices.html" class="badge badge-subtle">Publish Notice</a>
                        </div>
                        <div>
                            ${renderNoticeItems(getStoredNotices().slice(0, 3))}
                        </div>
                    </div>

                    <!-- Member Verification & Approval Section -->
                    <div id="userVerificationSection" style="margin-top:24px;"></div>
                `;

                animateCounter(document.getElementById('aStudents'), totalStudentsCount);
                animateCounter(document.getElementById('aTeachers'), TEACHERS.length);
                animateCounter(document.getElementById('aClasses'), CLASSES.length);
                animateCounter(document.getElementById('aNotices'), totalNotices);
            }
        });
    </script>
</body>
</html>
