<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101918">
    <title>Watch Videos | Damodar Dhakal</title>
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        :root {
            color-scheme: dark;
            --watch-bg: #101918;
            --watch-panel: #182321;
            --watch-border: #33423d;
            --watch-text: #f4f4ed;
            --watch-muted: #b0bdb5;
            --watch-accent: #e2a848;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 12% 0%, #263c32 0, transparent 42%), var(--watch-bg);
            color: var(--watch-text);
            font-family: 'Poppins', sans-serif;
        }
        .watch-page {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }
        .watch-topbar { margin-bottom: 26px; }
        .watch-topbar a { color: var(--watch-accent); text-decoration: none; }
        .watch-panel {
            padding: clamp(20px, 4vw, 36px);
            background: var(--watch-panel);
            border: 1px solid var(--watch-border);
            border-radius: 8px;
        }
        h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.2rem); }
        .watch-intro, .watch-note { color: var(--watch-muted); line-height: 1.65; }
        .watch-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 24px; }
        .watch-form label { grid-column: 1 / -1; font-weight: 600; }
        .watch-form input {
            min-width: 0;
            padding: 12px 14px;
            color: var(--watch-text);
            background: #101918;
            border: 1px solid #58665f;
            border-radius: 4px;
            font: inherit;
        }
        .watch-form input:focus { outline: 2px solid var(--watch-accent); outline-offset: 2px; }
        .watch-form button, .watch-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 10px 18px;
            color: #172018;
            background: var(--watch-accent);
            border: 0;
            border-radius: 4px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .watch-status { min-height: 1.5em; margin: 16px 0 0; color: var(--watch-muted); }
        .watch-player { margin-top: 20px; }
        .watch-player[hidden], .watch-link[hidden], .watch-progress[hidden] { display: none; }
        .watch-frame, .watch-video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #080c0b;
            border: 0;
            border-radius: 4px;
        }
        .watch-video { height: auto; max-height: 75vh; }
        .watch-link { margin-top: 14px; }
        .watch-progress { margin-top: 16px; }
        .watch-progress label { display: block; margin-bottom: 8px; color: var(--watch-muted); }
        .watch-progress progress { display: block; width: 100%; height: 12px; accent-color: var(--watch-accent); }
        .watch-note { margin: 18px 0 0; font-size: 0.9rem; }
        @media (max-width: 560px) {
            .watch-page { padding: 28px 0; }
            .watch-form { grid-template-columns: 1fr; }
            .watch-form label { grid-column: auto; }
        }
    </style>
</head>
<body>
    <main class="watch-page">
        <nav class="watch-topbar" aria-label="Breadcrumb">
            <a href="tools.html">&larr; Tools</a>
        </nav>
        <section class="watch-panel" aria-labelledby="watch-title">
            <h1 id="watch-title">Watch Videos</h1>
            <p class="watch-intro">Enter a video link to watch it here when embedding is supported, or open the source website.</p>
            <form class="watch-form" id="watch-form">
                <label for="video-url">Video website link</label>
                <input id="video-url" name="video-url" type="url" inputmode="url" placeholder="https://..." autocomplete="url" required>
                <button type="submit">Load video</button>
            </form>
            <p class="watch-status" id="watch-status" role="status" aria-live="polite"></p>
            <div class="watch-player" id="watch-player" hidden></div>
            <div class="watch-progress" id="watch-progress" hidden>
                <label for="video-progress" id="progress-label">Playback progress: 0%</label>
                <progress id="video-progress" max="100" value="0">0%</progress>
            </div>
            <a class="watch-link" id="watch-link" target="_blank" rel="noopener noreferrer" hidden>Open original video</a>
            <p class="watch-note">Playback and view counts are handled by the video provider. This page does not refresh videos or simulate views.</p>
        </section>
    </main>
    <script src="watch.js" defer></script>
</body>
</html>
