<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Messages | Parent Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .msg-positive    { border-left: 3px solid var(--emerald); }
        .msg-suggestion  { border-left: 3px solid var(--gold); }
        .msg-info        { border-left: 3px solid var(--cyan); }
        .msg-parent      { border-left: 3px solid var(--violet); background: rgba(192,132,252,0.04); }
        .msg-type-label { font-size: 10px; text-transform: uppercase; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
        .lbl-positive    { background: rgba(0,255,157,0.15); color: var(--emerald); }
        .lbl-suggestion  { background: rgba(255,215,0,0.15); color: var(--gold); }
        .lbl-info        { background: rgba(0,245,255,0.15); color: var(--cyan); }
        .lbl-parent      { background: rgba(192,132,252,0.15); color: var(--violet); }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'parent',
            pageId: 'messages',
            onReady: (main) => {
                function renderMessages() {
                    const currentMessages = getStoredMessages();
                    if (currentMessages.length === 0) {
                        return `<div style="text-align:center; padding:40px; color:var(--text-muted);"><i class='bx bx-message-x' style="font-size:48px; opacity:0.3;"></i><p style="margin-top:12px;">No messages yet.</p></div>`;
                    }
                    return currentMessages.map(m => `
                        <div class="card notice-card fade-in msg-${m.type}" style="margin-bottom:16px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
                                <div style="font-weight:700; color:${m.type === 'parent' ? 'var(--violet)' : 'var(--text-main)'}; font-size:15px;">
                                    <i class='bx ${m.type === 'parent' ? 'bx-user-voice' : 'bx-chalkboard'}'></i>
                                    ${m.from}
                                    <span class="msg-type-label lbl-${m.type}">${m.type}</span>
                                </div>
                                <span style="font-size:12px; color:var(--text-muted); white-space:nowrap;"><i class='bx bx-calendar'></i> ${m.date}</span>
                            </div>
                            <p style="color:var(--text-secondary); font-size:13px; line-height:1.6; margin:8px 0;">${m.message}</p>
                        </div>
                    `).join('');
                }

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Teacher & School Communication</h1>
                            <p>Direct Messages from Class Teachers, Administration & Your Sent Messages</p>
                        </div>
                        <button onclick="toggleComposeForm()" class="login-btn" style="padding:10px 20px; font-size:13px;"><i class='bx bx-send'></i> Send Message</button>
                    </div>

                    <!-- Compose Form -->
                    <div id="composeCard" class="card fade-in" style="display:none; margin-bottom:24px; border:1px solid var(--violet);">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-send' style="color:var(--violet);"></i> Send Message to Teacher</span>
                        </div>
                        <form id="composeForm" style="display:flex; flex-direction:column; gap:14px;">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Recipient Teacher / Dept *</label>
                                    <select id="msgTo" class="gpa-select" style="width:100%;">
                                        ${TEACHERS.map(t => `<option value="${t.name} (${t.subject})">${t.name} — ${t.subject}</option>`).join('')}
                                        <option value="Administration">School Administration</option>
                                        <option value="Principal's Office">Principal's Office</option>
                                    </select>
                                </div>
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Regarding *</label>
                                    <select id="msgRegarding" class="gpa-select" style="width:100%;">
                                        <option value="Academic Performance">Academic Performance</option>
                                        <option value="Attendance Concern">Attendance Concern</option>
                                        <option value="Leave Application">Leave Application</option>
                                        <option value="Behavioral Concern">Behavioral Concern</option>
                                        <option value="General Inquiry">General Inquiry</option>
                                        <option value="Fee Related">Fee Related</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label style="font-size:12px; color:var(--text-muted);">Your Message *</label>
                                <textarea id="msgText" required class="gpa-select" style="width:100%; height:90px; font-family:inherit; resize:vertical;" placeholder="Type your message here..."></textarea>
                            </div>
                            <div style="display:flex; justify-content:flex-end; gap:10px;">
                                <button type="button" onclick="toggleComposeForm()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit;">Cancel</button>
                                <button type="submit" class="login-btn" style="padding:8px 20px; font-size:12px; background:var(--violet);"><i class='bx bx-send'></i> Send Message</button>
                            </div>
                        </form>
                    </div>

                    <div id="messagesContainer">
                        ${renderMessages()}
                    </div>
                `;

                window.toggleComposeForm = function() {
                    const c = document.getElementById('composeCard');
                    const showing = c.style.display !== 'none';
                    c.style.display = showing ? 'none' : 'block';
                    if (!showing) c.scrollIntoView({ behavior: 'smooth' });
                };

                document.getElementById('composeForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const to      = document.getElementById('msgTo').value;
                    const re      = document.getElementById('msgRegarding').value;
                    const msgText = document.getElementById('msgText').value.trim();
                    const all     = getStoredMessages();
                    const newMsg  = {
                        id: Date.now(),
                        from: `Krishna Dhakal (Parent) → ${to}`,
                        date: getNepaliDate(),
                        message: `[Re: ${re}] ${msgText}`,
                        type: 'parent'
                    };
                    all.unshift(newMsg);
                    saveMessages(all);
                    document.getElementById('messagesContainer').innerHTML = renderMessages();
                    alert(`✅ Your message has been sent to ${to}.`);
                    e.target.reset();
                    toggleComposeForm();
                });
            }
        });
    </script>
</body>
</html>
