<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Messages | Parent Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'parent',
            pageId: 'messages',
            onReady: (main) => {
                let msgCards = PARENT_MESSAGES.map(m => `
                    <div class="card notice-card fade-in" style="margin-bottom:16px;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                            <div style="font-weight:700; color:var(--violet); font-size:15px;"><i class='bx bx-user-voice'></i> ${m.from}</div>
                            <span style="font-size:12px; color:var(--text-muted);"><i class='bx bx-calendar'></i> ${m.date}</span>
                        </div>
                        <p style="color:var(--text-secondary); font-size:13px; line-height:1.6; margin:8px 0;">${m.message}</p>
                        <div style="font-size:11px; color:var(--text-muted); text-align:right;">Notice Category: <span style="text-transform:capitalize; font-weight:700;">${m.type}</span></div>
                    </div>
                `).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Teacher & School Communication</h1>
                            <p>Direct Messages from Class Teachers and Administration</p>
                        </div>
                    </div>

                    <div>
                        ${msgCards}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
