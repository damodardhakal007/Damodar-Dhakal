<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Progress | Parent Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'parent',
            pageId: 'progress',
            onReady: (main) => {
                const childId = USERS.parent.childId;
                const childGrades = getStoredGrades().filter(g => g.studentId === childId);
                const liveGPA = calculateStudentGPA(childId);

                let progressRows = childGrades.map(g => {
                    const subName = getSubjectName(g.subjectCode);
                    return `
                        <tr>
                            <td><strong>${subName}</strong></td>
                            <td>${g.internal} / 40</td>
                            <td>${g.external} / 60</td>
                            <td><strong>${g.total} / 100</strong></td>
                            <td><span class="badge ${g.gradeClass}">${g.grade} (${g.gpa.toFixed(1)})</span></td>
                            <td>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <div style="flex:1; height:6px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden;">
                                        <div style="height:100%; width:${g.total}%; background:var(--violet); border-radius:3px;"></div>
                                    </div>
                                    <span style="font-size:11px; font-weight:700; color:var(--violet);">${g.total}%</span>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Academic Progress & Performance</h1>
                            <p>Detailed Subject-wise Terminal Assessment for Damodar Dhakal</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:24px;">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-line-chart' style="color:var(--violet);"></i> First Terminal Report Card</span>
                            <span style="font-weight:700; color:var(--violet); font-size:16px;">Cumulative GPA: ${liveGPA} / 4.0</span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Subject</th><th>Internal (40)</th><th>External (60)</th><th>Total Marks</th><th>Grade (GPA)</th><th>Performance Bar</th></tr>
                            </thead>
                            <tbody>
                                ${progressRows}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
