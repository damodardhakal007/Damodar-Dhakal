<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'schedule',
            onReady: (main) => {
                const days = [
                    { id: 'sun', label: 'Sunday' },
                    { id: 'mon', label: 'Monday' },
                    { id: 'tue', label: 'Tuesday' },
                    { id: 'wed', label: 'Wednesday' },
                    { id: 'thu', label: 'Thursday' },
                    { id: 'fri', label: 'Friday' },
                ];

                const todayKey = getTodayKey();
                // Default to today's tab, fallback to sunday
                const defaultDay = days.find(d => d.id === todayKey) ? todayKey : 'sun';

                let tabs = days.map((d) => `
                    <button class="nav-tab ${d.id === defaultDay ? 'active' : ''}" onclick="switchDay('${d.id}', this)">
                        ${d.label}
                        ${d.id === todayKey ? '<span style="font-size:9px; background:var(--cyan); color:#000; border-radius:3px; padding:1px 4px; margin-left:4px; font-weight:700; vertical-align:middle;">TODAY</span>' : ''}
                    </button>
                `).join('');

                const todayCount = (CLASS_SCHEDULE[todayKey] || []).length;

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Class Timetable</h1>
                            <p>
                                Weekly Schedule — Class 10 Section A &nbsp;|&nbsp;
                                <strong style="color:var(--cyan);">${getDayName()}</strong>:
                                ${todayCount > 0 ? `${todayCount} class${todayCount > 1 ? 'es' : ''} scheduled today` : 'No classes today'}
                            </p>
                        </div>
                    </div>

                    <div class="nav-tabs fade-in" style="margin-bottom:20px;">
                        ${tabs}
                    </div>

                    <div class="card fade-in" style="margin-bottom:16px; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                        <span style="font-size:13px; font-weight:600; color:var(--text-muted);">Legend:</span>
                        <span style="font-size:12px; display:flex; align-items:center; gap:6px;">
                            <span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--cyan); border-left:3px solid var(--cyan);"></span>
                            <span style="font-size:10px; background:var(--cyan); color:#000; border-radius:4px; padding:1px 5px; font-weight:700;">NOW</span>
                            Currently active period
                        </span>
                        <span style="font-size:12px; color:var(--text-muted);">Periods auto-highlighted based on your system clock.</span>
                    </div>

                    <div id="scheduleContainer" class="card fade-in">
                        ${renderScheduleItems(CLASS_SCHEDULE[defaultDay] || [])}
                    </div>
                `;

                window.switchDay = function(dayKey, btn) {
                    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('scheduleContainer').innerHTML = renderScheduleItems(CLASS_SCHEDULE[dayKey] || []);
                };
            }
        });
    </script>
</body>
</html>
