<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'schedule',
            onReady: (main) => {
                const days = [
                    { id: 'sun', label: 'Sunday' },
                    { id: 'mon', label: 'Monday' },
                    { id: 'tue', label: 'Tuesday' },
                    { id: 'wed', label: 'Wednesday' },
                    { id: 'thu', label: 'Thursday' },
                    { id: 'fri', label: 'Friday' },
                ];

                let tabs = days.map((d, i) => `
                    <button class="nav-tab ${i === 0 ? 'active' : ''}" onclick="switchDay('${d.id}', this)">${d.label}</button>
                `).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Class Timetable</h1>
                            <p>Weekly Class Schedule — Class 10 Section A</p>
                        </div>
                    </div>

                    <div class="nav-tabs fade-in" style="margin-bottom:20px;">
                        ${tabs}
                    </div>

                    <div id="scheduleContainer" class="card fade-in">
                        ${renderScheduleItems(CLASS_SCHEDULE['sun'])}
                    </div>
                `;

                window.switchDay = function(dayKey, btn) {
                    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('scheduleContainer').innerHTML = renderScheduleItems(CLASS_SCHEDULE[dayKey]);
                };
            }
        });
    </script>
</body>
</html>
