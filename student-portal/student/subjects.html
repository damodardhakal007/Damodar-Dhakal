<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects & Grades | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'subjects',
            onReady: (main) => {
                let rows = MY_GRADES.map(g => {
                    const sub = SUBJECTS_C10.find(s => s.code === g.subjectCode);
                    const teacher = TEACHERS.find(t => t.id === sub.teacher);
                    return `
                        <tr>
                            <td>
                                <strong>${sub.name}</strong><br>
                                <span style="font-size:11px; color:var(--text-muted);">${g.subjectCode} • ${sub.credit} Credits</span>
                            </td>
                            <td>${teacher ? teacher.name : 'Faculty'}</td>
                            <td>${g.internal} / ${g.internalMax}</td>
                            <td>${g.external} / ${g.externalMax}</td>
                            <td><strong>${g.total} / 100</strong></td>
                            <td><span class="badge ${g.gradeClass}">${g.grade} (${g.gpa.toFixed(1)})</span></td>
                        </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Subjects & Grade Sheet</h1>
                            <p>Class 10 — First Terminal Marks & Academic Assessment</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:24px;">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-book-open' style="color:var(--cyan);"></i> Enrolled Courses (8 Subjects)</span>
                            <span style="font-weight:700; color:var(--cyan);">Terminal Overall GPA: ${MY_GPA}</span>
                        </div>
                        <div style="overflow-x:auto;">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Subject</th>
                                        <th>Teacher</th>
                                        <th>Internal (40)</th>
                                        <th>External (60)</th>
                                        <th>Total (100)</th>
                                        <th>Grade</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
