<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({ role: 'student', pageId: 'dashboard', onReady: function(main) {
            const me = STUDENTS.find(s => s.id === 'STU-10A-007');
            const cls = CLASSES.find(c => c.id === (me ? me.classId : 'C10A'));
            const today = getTodayKey();
            const todaySched = CLASS_SCHEDULE[today] || CLASS_SCHEDULE['sun'];

            main.innerHTML = `
                <div class="page-header fade-in">
                    <h1><i class='bx bxs-dashboard' style="color:var(--cyan);"></i> Dashboard</h1>
                    <p>Welcome, ${me ? me.name : 'Student'}! Class ${cls ? cls.name + ' ' + cls.section : '10A'}</p>
                </div>

                <div class="stats-row fade-in">
                    <div class="stat-card"><div class="stat-icon"><i class='bx bx-book-open'></i></div><div class="stat-info"><h4>Subjects</h4><div class="stat-val" id="s1">0</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class='bx bx-check-circle'></i></div><div class="stat-info"><h4>Attendance</h4><div class="stat-val" id="s2">0%</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class='bx bx-trophy'></i></div><div class="stat-info"><h4>GPA</h4><div class="stat-val" id="s3">0.00</div></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class='bx bx-bell'></i></div><div class="stat-info"><h4>Notices</h4><div class="stat-val" id="s4">0</div></div></div>
                </div>

                <div class="portal-card fade-in">
                    <div class="card-header"><i class='bx bx-rocket' style="color:var(--cyan);"></i> Quick Actions</div>
                    <div class="quick-actions">
                        <a href="profile.html" class="action-btn"><i class='bx bx-user-circle'></i> Profile</a>
                        <a href="subjects.html" class="action-btn"><i class='bx bx-book-reader'></i> Grades</a>
                        <a href="attendance.html" class="action-btn"><i class='bx bx-calendar-check'></i> Attendance</a>
                        <a href="schedule.html" class="action-btn"><i class='bx bx-calendar'></i> Schedule</a>
                        <a href="gpa.html" class="action-btn"><i class='bx bx-bar-chart-alt-2'></i> GPA</a>
                        <a href="notices.html" class="action-btn"><i class='bx bx-bell'></i> Notices</a>
                    </div>
                </div>

                <div class="two-col">
                    <div class="portal-card fade-in">
                        <div class="card-header"><i class='bx bx-book-reader' style="color:var(--gold);"></i> Top Grades</div>
                        <div id="topGrades"></div>
                    </div>
                    <div class="portal-card fade-in">
                        <div class="card-header"><i class='bx bx-calendar' style="color:var(--emerald);"></i> Today's Classes</div>
                        <div class="schedule-list">${renderScheduleItems(todaySched.slice(0,4))}</div>
                        <a href="schedule.html" style="display:block; text-align:center; padding:10px; color:var(--cyan); text-decoration:none; font-size:13px; font-weight:600;">Full Schedule →</a>
                    </div>
                </div>

                <div class="portal-card fade-in">
                    <div class="card-header"><i class='bx bx-bell' style="color:var(--magenta);"></i> Recent Notices</div>
                    ${renderNoticeItems(NOTICES.slice(0,3))}
                    <a href="notices.html" style="display:block; text-align:center; padding:10px; color:var(--cyan); text-decoration:none; font-size:13px; font-weight:600;">All Notices →</a>
                </div>
            `;

            animateCounter(document.getElementById('s1'), SUBJECTS_C10.length);
            animateCounter(document.getElementById('s2'), MY_ATTENDANCE.percentage, 0, '%');
            animateCounter(document.getElementById('s3'), MY_GPA, 2);
            animateCounter(document.getElementById('s4'), NOTICES.length);

            // Top grades
            const sorted = [...MY_GRADES].sort((a,b) => b.total - a.total);
            document.getElementById('topGrades').innerHTML = sorted.slice(0,4).map(g => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:rgba(255,255,255,0.03); border-radius:10px; margin-bottom:8px;">
                    <div><div style="font-weight:700; font-size:14px;">${getSubjectName(g.subjectCode)}</div><div style="font-size:12px; color:var(--text-muted);">${g.total}/100</div></div>
                    <span class="grade-badge ${g.gradeClass}">${g.grade}</span>
                </div>
            `).join('');
        }});
    </script>
</body>
</html>
