<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'profile',
            onReady: (main) => {
                const currentStudents = getStoredStudents();
                const s = currentStudents.find(x => x.id === CURRENT_USER.id) || currentStudents[6];
                const c = CLASSES.find(x => x.id === s.classId) || CLASSES[8];
                const teacher = TEACHERS.find(x => x.id === c.classTeacher);
                const liveGPA = calculateStudentGPA(s.id);

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>My Profile</h1>
                            <p>Kavresthali Secondary School — Student Profile & Academic Details</p>
                        </div>
                    </div>

                    <div class="profile-card fade-in" style="margin-bottom:24px;">
                        <div class="profile-avatar"><i class='bx bxs-user-badge'></i></div>
                        <div class="profile-details">
                            <h2>${s.name}</h2>
                            <p class="role-badge">${c.name} ${c.section} • Roll No: ${s.roll} • ID: ${s.id}</p>
                            <p><i class='bx bx-building-house'></i> ${SCHOOL.name}</p>
                            <p><i class='bx bx-user'></i> Class Teacher: ${teacher ? teacher.name : 'Ram Bahadur Sharma'}</p>
                            <p><i class='bx bx-droplet'></i> Blood Group: <strong>${s.bloodGroup}</strong> | DOB: <strong>${s.dob}</strong></p>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-id-card' style="color:var(--cyan);"></i> Personal Information</span>
                            </div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Full Name</div>
                                    <div style="font-weight:600; margin-top:2px;">${s.name}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Gender</div>
                                    <div style="font-weight:600; margin-top:2px;">${s.gender === 'M' ? 'Male' : 'Female'}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Parent / Guardian</div>
                                    <div style="font-weight:600; margin-top:2px;">${s.parent}</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Contact Phone</div>
                                    <div style="font-weight:600; margin-top:2px;">${s.phone}</div>
                                </div>
                                <div style="grid-column: span 2;">
                                    <div style="font-size:12px; color:var(--text-muted);">Address</div>
                                    <div style="font-weight:600; margin-top:2px;">${s.address}, Kathmandu</div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-award' style="color:var(--gold);"></i> Academic Record</span>
                            </div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Academic Year</div>
                                    <div style="font-weight:600; margin-top:2px;">2083 BS</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Current Grade</div>
                                    <div style="font-weight:600; margin-top:2px;">${c.name} (SEE Batch)</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Current Cumulative GPA</div>
                                    <div style="font-weight:700; color:var(--cyan); font-size:18px; margin-top:2px;">${liveGPA} / 4.0</div>
                                </div>
                                <div>
                                    <div style="font-size:12px; color:var(--text-muted);">Attendance Rate</div>
                                    <div style="font-weight:700; color:var(--emerald); font-size:18px; margin-top:2px;">${MY_ATTENDANCE.percentage}%</div>
                                </div>
                                <div style="grid-column: span 2;">
                                    <div style="font-size:12px; color:var(--text-muted);">Enrolled Subjects</div>
                                    <div style="font-weight:600; margin-top:2px;">8 Compulsory & Elective Courses</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
