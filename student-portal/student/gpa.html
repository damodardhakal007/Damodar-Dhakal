<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator | Student Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'student',
            pageId: 'gpa',
            onReady: (main) => {
                // Always read fresh grades from storage
                const freshGrades = getMyGrades();
                let rows = SUBJECTS_C10.map(s => {
                    const grade = freshGrades.find(g => g.subjectCode === s.code);
                    // Pre-select the dropdown matching current stored GPA value
                    const gpaNow = grade ? grade.gpa : 0;
                    const opts = [
                        { val: '4.0', label: 'A+ (4.0)' },
                        { val: '3.6', label: 'A (3.6)'  },
                        { val: '3.2', label: 'B+ (3.2)' },
                        { val: '2.8', label: 'B (2.8)'  },
                        { val: '2.4', label: 'C+ (2.4)' },
                        { val: '2.0', label: 'C (2.0)'  },
                        { val: '1.6', label: 'D (1.6)'  },
                        { val: '0.0', label: 'NG / F (0.0)' },
                    ];
                    const options = opts.map(o =>
                        `<option value="${o.val}" ${Math.abs(parseFloat(o.val) - gpaNow) < 0.1 ? 'selected' : ''}>${o.label}</option>`
                    ).join('');
                    return `
                        <tr>
                            <td><strong>${s.name}</strong><br><span style="font-size:11px;color:var(--text-muted);">${s.code}</span></td>
                            <td style="text-align:center;">${s.credit}</td>
                            <td>
                                <select class="gpa-select" data-credit="${s.credit}" onchange="calcGpa()" style="width:100%;">
                                    ${options}
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>GPA Calculator</h1>
                            <p>Interactive Grade Point Average Calculator — SEE Grading System (Nepal CDC standard)</p>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in" style="margin-bottom:24px;">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-calculator' style="color:var(--cyan);"></i> Select Expected Subject Grades</span>
                            </div>
                            <table class="table">
                                <thead>
                                    <tr><th>Subject</th><th style="text-align:center;">Credits</th><th>Grade / GPA Point</th></tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                            <div style="text-align:right; margin-top:12px;">
                                <button onclick="resetGpa()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:12px;"><i class='bx bx-reset'></i> Reset All</button>
                            </div>
                        </div>

                        <div style="display:flex; flex-direction:column; gap:20px;">
                            <div class="card" style="text-align:center; padding:32px;">
                                <div style="font-size:14px; color:var(--text-muted);">Calculated Cumulative GPA</div>
                                <div id="gpaResult" style="font-size:60px; font-weight:800; color:var(--cyan); margin:12px 0; transition: color 0.3s;">3.68</div>
                                <div id="gpaRemark" style="font-weight:700; color:var(--emerald); font-size:16px;">Outstanding (A)</div>
                                <div id="gpaCredits" style="font-size:12px; color:var(--text-muted); margin-top:12px;">Based on total credit weightage: 24 Credit Hours</div>
                                <div style="margin-top:16px; height:8px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden;">
                                    <div id="gpaBar" style="height:100%; width:92%; background:linear-gradient(90deg,var(--cyan),var(--emerald)); border-radius:4px; transition:width 0.4s ease;"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="card-title"><i class='bx bx-info-circle' style="color:var(--gold);"></i> Grading Scale Reference (Nepal CDC)</span>
                                </div>
                                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:12px;">
                                    <div style="padding:6px 8px; background:rgba(0,245,255,0.08); border-radius:6px;"><strong>90% – 100%</strong> → A+ (4.0)</div>
                                    <div style="padding:6px 8px; background:rgba(0,255,157,0.08); border-radius:6px;"><strong>80% – 89%</strong>  → A (3.6)</div>
                                    <div style="padding:6px 8px; background:rgba(255,215,0,0.08); border-radius:6px;"><strong>70% – 79%</strong>  → B+ (3.2)</div>
                                    <div style="padding:6px 8px; background:rgba(255,215,0,0.06); border-radius:6px;"><strong>60% – 69%</strong>  → B (2.8)</div>
                                    <div style="padding:6px 8px; background:rgba(251,113,133,0.08); border-radius:6px;"><strong>50% – 59%</strong>  → C+ (2.4)</div>
                                    <div style="padding:6px 8px; background:rgba(251,113,133,0.06); border-radius:6px;"><strong>40% – 49%</strong>  → C (2.0)</div>
                                    <div style="padding:6px 8px; background:rgba(255,255,255,0.04); border-radius:6px;"><strong>35% – 39%</strong>  → D (1.6)</div>
                                    <div style="padding:6px 8px; background:rgba(255,255,255,0.04); border-radius:6px;"><strong>Below 35%</strong> → NG / F (0.0)</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // FIX: Corrected GPA remark thresholds (A+ requires 4.0, A requires ≥3.6)
                window.calcGpa = function() {
                    let totalPoints = 0;
                    let totalCredits = 0;
                    document.querySelectorAll('.gpa-select').forEach(sel => {
                        const c = parseFloat(sel.dataset.credit);
                        const p = parseFloat(sel.value);
                        totalPoints += (p * c);
                        totalCredits += c;
                    });
                    const gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
                    const gpaNum = parseFloat(gpa);
                    document.getElementById('gpaResult').textContent = gpa;
                    document.getElementById('gpaCredits').textContent = `Based on total credit weightage: ${totalCredits} Credit Hours`;

                    const remark = document.getElementById('gpaRemark');
                    const bar    = document.getElementById('gpaBar');
                    const result = document.getElementById('gpaResult');

                    // FIX: correct thresholds — 4.0 = A+, 3.6 = A, 3.2 = B+, etc.
                    if (gpaNum >= 4.0)       { remark.textContent = '🏆 Outstanding (A+)'; remark.style.color = 'var(--cyan)';    result.style.color = 'var(--cyan)'; }
                    else if (gpaNum >= 3.6)  { remark.textContent = '⭐ Excellent (A)';     remark.style.color = 'var(--emerald)'; result.style.color = 'var(--emerald)'; }
                    else if (gpaNum >= 3.2)  { remark.textContent = '👍 Very Good (B+)';    remark.style.color = 'var(--gold)';    result.style.color = 'var(--gold)'; }
                    else if (gpaNum >= 2.8)  { remark.textContent = '✅ Good (B)';           remark.style.color = 'var(--amber)';   result.style.color = 'var(--amber)'; }
                    else if (gpaNum >= 2.4)  { remark.textContent = '📖 Satisfactory (C+)'; remark.style.color = 'var(--coral)';   result.style.color = 'var(--coral)'; }
                    else if (gpaNum >= 2.0)  { remark.textContent = '📖 Acceptable (C)';    remark.style.color = 'var(--rose)';    result.style.color = 'var(--rose)'; }
                    else                     { remark.textContent = '⚠️ Needs Improvement';  remark.style.color = 'var(--rose)';    result.style.color = 'var(--rose)'; }

                    bar.style.width = Math.min((gpaNum / 4.0) * 100, 100) + '%';
                };

                window.resetGpa = function() {
                    document.querySelectorAll('.gpa-select').forEach(sel => sel.selectedIndex = 0);
                    calcGpa();
                };

                // Initial calculation
                calcGpa();
            }
        });
    </script>
</body>
</html>
