<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Teacher Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'teacher',
            pageId: 'attendance',
            onReady: (main) => {
                const class10AStudents = STUDENTS.filter(s => s.classId === 'C10A');
                let rows = class10AStudents.map((s, idx) => `
                    <tr>
                        <td>${s.roll}</td>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.id}</td>
                        <td>
                            <div style="display:flex; gap:10px;">
                                <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                    <input type="radio" name="att_${s.id}" value="P" checked> <span class="attendance-tag bg-present">Present</span>
                                </label>
                                <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                    <input type="radio" name="att_${s.id}" value="A"> <span class="attendance-tag bg-absent">Absent</span>
                                </label>
                                <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:13px;">
                                    <input type="radio" name="att_${s.id}" value="L"> <span class="attendance-tag bg-late">Late</span>
                                </label>
                            </div>
                        </td>
                    </tr>
                `).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Mark Daily Attendance</h1>
                            <p>Select class, pick date, and mark student presence</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Select Class</label>
                            <select id="classSelect" class="gpa-select" style="width:160px;">
                                <option value="C10A" selected>Class 10 - Sec A</option>
                                <option value="C10B">Class 10 - Sec B</option>
                                <option value="C9A">Class 9 - Sec A</option>
                                <option value="C9B">Class 9 - Sec B</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Date</label>
                            <input type="date" value="${new Date().toISOString().split('T')[0]}" class="gpa-select" style="width:170px;">
                        </div>
                        <div style="margin-left:auto;">
                            <button onclick="saveAttendance()" class="login-btn" style="padding:10px 24px; font-size:13px;"><i class='bx bx-check-circle'></i> Submit Attendance</button>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-group' style="color:var(--emerald);"></i> Class 10A Student Roster (${class10AStudents.length} Students)</span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Roll</th><th>Student Name</th><th>Student ID</th><th>Attendance Status</th></tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;

                window.saveAttendance = function() {
                    alert('Attendance marked and recorded successfully for Class 10A!');
                };
            }
        });
    </script>
</body>
</html>
