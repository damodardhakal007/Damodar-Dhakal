<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roster | Teacher Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'teacher',
            pageId: 'students',
            onReady: (main) => {
                const currentStudents = getStoredStudents();

                let renderStudentRows = (list) => {
                    if (list.length === 0) {
                        return '<tr><td colspan="7" style="text-align:center; padding:20px; color:var(--text-muted);">No student records found.</td></tr>';
                    }
                    return list.map(s => {
                        const c = CLASSES.find(x => x.id === s.classId);
                        const className = c ? `${c.name} ${c.section}` : s.classId;
                        return `
                            <tr>
                                <td><code>${s.id}</code></td>
                                <td><strong>${s.name}</strong></td>
                                <td>${className}</td>
                                <td>${s.roll}</td>
                                <td>${s.parent || '—'}</td>
                                <td>${s.phone || '—'}</td>
                                <td><span class="badge badge-subtle">${s.address || 'Kathmandu'}</span></td>
                            </tr>
                        `;
                    }).join('');
                };

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Student Roster & Directory</h1>
                            <p>Search and view student profiles across assigned classes</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:20px; display:flex; gap:16px; align-items:center;">
                        <div style="flex:1; position:relative;">
                            <input type="text" id="searchInput" placeholder="Search student by name, ID or parent..." class="gpa-select" style="width:100%; padding-left:36px;">
                            <i class='bx bx-search' style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
                        </div>
                        <select id="classFilter" class="gpa-select" style="width:160px;">
                            <option value="ALL">All Classes</option>
                            ${CLASSES.map(c => `<option value="${c.id}">${c.name} ${c.section}</option>`).join('')}
                        </select>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-group' style="color:var(--emerald);"></i> Student Roster (<span id="stuCount">${currentStudents.length}</span> Records)</span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Student ID</th><th>Name</th><th>Class</th><th>Roll</th><th>Parent / Guardian</th><th>Phone</th><th>Address</th></tr>
                            </thead>
                            <tbody id="studentTableBody">
                                ${renderStudentRows(currentStudents)}
                            </tbody>
                        </table>
                    </div>
                `;

                const searchInput = document.getElementById('searchInput');
                const classFilter = document.getElementById('classFilter');
                const tbody = document.getElementById('studentTableBody');
                const countSpan = document.getElementById('stuCount');

                function filterData() {
                    const query = searchInput.value.toLowerCase().trim();
                    const cls = classFilter.value;
                    const filtered = currentStudents.filter(s => {
                        const matchQuery = s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query) || (s.parent && s.parent.toLowerCase().includes(query));
                        const matchClass = cls === 'ALL' || s.classId === cls;
                        return matchQuery && matchClass;
                    });
                    tbody.innerHTML = renderStudentRows(filtered);
                    countSpan.textContent = filtered.length;
                }

                searchInput.addEventListener('input', filterData);
                classFilter.addEventListener('change', filterData);
            }
        });
    </script>
</body>
</html>
