<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Grades | Teacher Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'teacher',
            pageId: 'grades',
            onReady: (main) => {
                const class10AStudents = STUDENTS.filter(s => s.classId === 'C10A');
                let rows = class10AStudents.map((s, idx) => {
                    const isDamodar = s.id === 'STU-10A-007';
                    const int = isDamodar ? 38 : Math.floor(30 + Math.random() * 9);
                    const ext = isDamodar ? 52 : Math.floor(40 + Math.random() * 18);
                    const total = int + ext;
                    let grade = 'A';
                    if (total >= 90) grade = 'A+';
                    else if (total >= 80) grade = 'A';
                    else if (total >= 70) grade = 'B+';
                    else if (total >= 60) grade = 'B';
                    return `
                        <tr>
                            <td>${s.roll}</td>
                            <td><strong>${s.name}</strong></td>
                            <td><input type="number" value="${int}" max="40" min="0" class="gpa-select" style="width:70px; text-align:center;"> / 40</td>
                            <td><input type="number" value="${ext}" max="60" min="0" class="gpa-select" style="width:70px; text-align:center;"> / 60</td>
                            <td><strong>${total} / 100</strong></td>
                            <td><span class="badge ${total >= 80 ? 'grade-a' : 'grade-b'}">${grade}</span></td>
                        </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Grade & Mark Entry Sheet</h1>
                            <p>First Terminal Examination 2083 — Subject: Mathematics</p>
                        </div>
                    </div>

                    <div class="card fade-in" style="margin-bottom:20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Select Class</label>
                            <select class="gpa-select" style="width:160px;">
                                <option value="C10A" selected>Class 10 - Sec A</option>
                                <option value="C10B">Class 10 - Sec B</option>
                                <option value="C9A">Class 9 - Sec A</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Subject</label>
                            <select class="gpa-select" style="width:180px;">
                                <option value="MATH-10" selected>Mathematics (MATH-10)</option>
                                <option value="OPTM-10">Opt. Mathematics</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:4px;">Exam Term</label>
                            <select class="gpa-select" style="width:160px;">
                                <option selected>First Terminal</option>
                                <option>Second Terminal</option>
                                <option>Final SEE Prep</option>
                            </select>
                        </div>
                        <div style="margin-left:auto;">
                            <button onclick="saveGrades()" class="login-btn" style="padding:10px 24px; font-size:13px;"><i class='bx bx-save'></i> Save Marks</button>
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-edit' style="color:var(--cyan);"></i> Marks Roster — Class 10A Mathematics</span>
                        </div>
                        <table class="table">
                            <thead>
                                <tr><th>Roll</th><th>Student Name</th><th>Internal Mark (40)</th><th>External Mark (60)</th><th>Total (100)</th><th>Grade</th></tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;

                window.saveGrades = function() {
                    alert('Grades saved and published successfully for Class 10A Mathematics!');
                };
            }
        });
    </script>
</body>
</html>
