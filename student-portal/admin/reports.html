<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Reports | Admin Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .stat-bar-row { margin-bottom: 16px; }
        .stat-bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .stat-bar-track { height: 10px; background: rgba(255,255,255,0.06); border-radius: 5px; overflow: hidden; }
        .stat-bar-fill  { height: 100%; border-radius: 5px; transition: width 1.2s cubic-bezier(0.25,0.46,0.45,0.94); }
        .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 8px; }
        .report-pill { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-align: center; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'admin',
            pageId: 'reports',
            onReady: (main) => {
                const allStudents = getStoredStudents();
                const totalStudents = allStudents.length;
                const totalEnroll = CLASSES.reduce((a, c) => a + c.students, 0);
                const knownGPA = calculateStudentGPA('STU-10A-007');

                // Per-class breakdown for chart (using CLASSES data + student records)
                const classStats = CLASSES.map(c => {
                    const enrolled = allStudents.filter(s => s.classId === c.id).length || c.students;
                    const maxEnroll = 40;
                    // Simulate attendance and GPA with slight variation
                    const attBase = 88 + Math.abs((c.id.charCodeAt(c.id.length-1) * 3) % 10);
                    const gpaBase = (3.2 + (c.id.charCodeAt(c.id.length-1) % 6) * 0.08).toFixed(2);
                    return { ...c, actualCount: enrolled, attRate: Math.min(attBase, 98), avgGPA: gpaBase };
                });

                // Subject performance from stored grades
                const allGrades = getStoredGrades();
                const subjectStats = SUBJECTS_C10.map(s => {
                    const grades = allGrades.filter(g => g.subjectCode === s.code);
                    if (grades.length === 0) return { ...s, avgScore: 82, passRate: 95 };
                    const avgScore = Math.round(grades.reduce((a, g) => a + g.total, 0) / grades.length);
                    const passing = grades.filter(g => g.total >= 40).length;
                    return { ...s, avgScore, passRate: Math.round((passing / grades.length) * 100) };
                });

                const subjectBars = subjectStats.map(s => {
                    const color = s.avgScore >= 85 ? 'var(--cyan)' : s.avgScore >= 70 ? 'var(--emerald)' : s.avgScore >= 55 ? 'var(--gold)' : 'var(--rose)';
                    return `
                    <div class="stat-bar-row">
                        <div class="stat-bar-label">
                            <span><strong>${s.name}</strong> <span style="font-size:11px; color:var(--text-muted);">(${s.code})</span></span>
                            <span style="font-weight:700; color:${color};">${s.avgScore}/100 &nbsp;<span style="font-size:11px; color:var(--text-muted);">${s.passRate}% pass</span></span>
                        </div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" style="width:${s.avgScore}%; background:${color};"></div>
                        </div>
                    </div>
                    `;
                }).join('');

                const classRows = classStats.map(c => {
                    const gpaColor = parseFloat(c.avgGPA) >= 3.6 ? 'var(--cyan)' : parseFloat(c.avgGPA) >= 3.2 ? 'var(--emerald)' : 'var(--gold)';
                    return `
                    <tr>
                        <td><strong>${c.name} ${c.section}</strong></td>
                        <td>
                            <div class="stat-bar-track" style="margin-top:4px; height:6px;">
                                <div class="stat-bar-fill" style="width:${(c.actualCount/40)*100}%; background:var(--gold);"></div>
                            </div>
                            <small style="color:var(--text-muted);">${c.actualCount} / 40</small>
                        </td>
                        <td>
                            <div class="stat-bar-track" style="margin-top:4px; height:6px;">
                                <div class="stat-bar-fill" style="width:${c.attRate}%; background:var(--emerald);"></div>
                            </div>
                            <small style="color:var(--emerald);">${c.attRate}%</small>
                        </td>
                        <td><span style="font-weight:700; color:${gpaColor};">${c.avgGPA}</span></td>
                        <td><span class="badge grade-a" style="font-size:11px;">≥ 95%</span></td>
                    </tr>
                    `;
                }).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Academic Analytics & Reports</h1>
                            <p>School-wide Attendance, Performance & GPA Statistics — ${getNepaliDate()}</p>
                        </div>
                    </div>

                    <div class="grid grid-4 fade-in" style="margin-bottom:24px;">
                        <div class="stat-card" style="text-align:center;">
                            <div class="stat-icon icon-emerald" style="margin:0 auto 8px;"><i class='bx bx-trending-up'></i></div>
                            <div class="stat-value" id="rPassRate">96.8</div>
                            <div class="stat-label">Overall Pass Rate %</div>
                        </div>
                        <div class="stat-card" style="text-align:center;">
                            <div class="stat-icon icon-cyan" style="margin:0 auto 8px;"><i class='bx bx-bar-chart-alt-2'></i></div>
                            <div class="stat-value" id="rGPA">3.42</div>
                            <div class="stat-label">School Avg GPA</div>
                        </div>
                        <div class="stat-card" style="text-align:center;">
                            <div class="stat-icon icon-gold" style="margin:0 auto 8px;"><i class='bx bx-calendar-check'></i></div>
                            <div class="stat-value" id="rAtt">94.2</div>
                            <div class="stat-label">Avg Attendance %</div>
                        </div>
                        <div class="stat-card" style="text-align:center;">
                            <div class="stat-icon icon-rose" style="margin:0 auto 8px;"><i class='bx bx-group'></i></div>
                            <div class="stat-value" id="rStudents">${totalStudents}</div>
                            <div class="stat-label">Active Students</div>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in" style="margin-bottom:24px;">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-book-open' style="color:var(--cyan);"></i> Subject Performance (Class 10)</span>
                            </div>
                            ${subjectBars}
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <span class="card-title"><i class='bx bx-line-chart' style="color:var(--gold);"></i> Class-wise Enrollment Breakdown</span>
                            </div>
                            ${classStats.map(c => {
                                const pct = Math.round((c.actualCount / 40) * 100);
                                const col = pct >= 90 ? 'var(--emerald)' : pct >= 75 ? 'var(--gold)' : 'var(--rose)';
                                return `
                                <div class="stat-bar-row">
                                    <div class="stat-bar-label">
                                        <span><strong>${c.name} ${c.section}</strong></span>
                                        <span style="color:${col}; font-weight:700;">${c.actualCount} students</span>
                                    </div>
                                    <div class="stat-bar-track">
                                        <div class="stat-bar-fill" style="width:${pct}%; background:${col};"></div>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="card fade-in">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-table' style="color:var(--gold);"></i> Class Performance Comparison</span>
                        </div>
                        <div style="overflow-x:auto;">
                            <table class="table">
                                <thead>
                                    <tr><th>Class Section</th><th>Enrollment</th><th>Attendance Rate</th><th>Avg GPA</th><th>Pass Rate</th></tr>
                                </thead>
                                <tbody>
                                    ${classRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                // Animate the top stats
                animateCounter(document.getElementById('rPassRate'), 96.8, 1);
                animateCounter(document.getElementById('rGPA'),      3.42,  2);
                animateCounter(document.getElementById('rAtt'),      94.2,  1);
                animateCounter(document.getElementById('rStudents'), totalStudents);
            }
        });
    </script>
</body>
</html>
