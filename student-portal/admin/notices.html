<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices | Admin Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'admin',
            pageId: 'notices',
            onReady: (main) => {
                let renderAdminNotices = () => {
                    return NOTICES.map(n => `
                        <div class="card notice-card fade-in" style="margin-bottom:16px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div>
                                    <span class="badge badge-subtle" style="text-transform:uppercase; margin-bottom:8px; display:inline-block;">${n.type}</span>
                                    <h3 style="margin-bottom:6px; font-size:16px;">${n.title}</h3>
                                </div>
                                <span style="font-size:12px; color:var(--text-muted);"><i class='bx bx-calendar'></i> ${n.date}</span>
                            </div>
                            <p style="color:var(--text-secondary); font-size:13px; margin:8px 0 12px;">${n.detail}</p>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.06); padding-top:8px; font-size:11px; color:var(--text-muted);">
                                <span>Author: <strong>${n.author}</strong></span>
                                <button onclick="deleteNotice(${n.id})" style="background:none; border:none; color:var(--rose); cursor:pointer; font-size:14px;"><i class='bx bx-trash'></i> Delete Notice</button>
                            </div>
                        </div>
                    `).join('');
                };

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Notice Board Management</h1>
                            <p>Publish and manage school announcements for Students, Parents, and Staff</p>
                        </div>
                        <button onclick="toggleNoticeForm()" class="login-btn" style="padding:10px 20px; font-size:13px;"><i class='bx bx-plus-circle'></i> Publish New Notice</button>
                    </div>

                    <div id="noticeFormCard" class="card fade-in" style="display:none; margin-bottom:24px; border:1px solid var(--gold);">
                        <div class="card-header">
                            <span class="card-title"><i class='bx bx-plus-circle' style="color:var(--gold);"></i> Publish Official Announcement</span>
                        </div>
                        <form id="newNoticeForm" style="display:flex; flex-direction:column; gap:14px;">
                            <div>
                                <label style="font-size:12px; color:var(--text-muted);">Notice Title</label>
                                <input type="text" id="nTitle" required class="gpa-select" style="width:100%;">
                            </div>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Category / Type</label>
                                    <select id="nType" class="gpa-select" style="width:100%;">
                                        <option value="exam">Examination</option>
                                        <option value="fee">Fee Notice</option>
                                        <option value="event">Event / Activity</option>
                                        <option value="general">General Notice</option>
                                    </select>
                                </div>
                                <div>
                                    <label style="font-size:12px; color:var(--text-muted);">Issuing Department / Author</label>
                                    <input type="text" id="nAuthor" value="Administration" required class="gpa-select" style="width:100%;">
                                </div>
                            </div>
                            <div>
                                <label style="font-size:12px; color:var(--text-muted);">Notice Detail Content</label>
                                <textarea id="nDetail" required class="gpa-select" style="width:100%; height:80px; font-family:inherit;"></textarea>
                            </div>
                            <div style="display:flex; justify-content:flex-end; gap:10px;">
                                <button type="button" onclick="toggleNoticeForm()" style="background:rgba(255,255,255,0.06); border:none; color:var(--text-main); padding:8px 16px; border-radius:8px; cursor:pointer;">Cancel</button>
                                <button type="submit" class="login-btn" style="padding:8px 20px; font-size:12px;">Publish Notice</button>
                            </div>
                        </form>
                    </div>

                    <div id="noticesList">
                        ${renderAdminNotices()}
                    </div>
                `;

                window.toggleNoticeForm = function() {
                    const c = document.getElementById('noticeFormCard');
                    c.style.display = c.style.display === 'none' ? 'block' : 'none';
                };

                document.getElementById('newNoticeForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newN = {
                        id: NOTICES.length + 1,
                        title: document.getElementById('nTitle').value,
                        type: document.getElementById('nType').value,
                        author: document.getElementById('nAuthor').value,
                        detail: document.getElementById('nDetail').value,
                        date: 'Bhadra 22, 2083'
                    };
                    NOTICES.unshift(newN);
                    document.getElementById('noticesList').innerHTML = renderAdminNotices();
                    alert('Notice published successfully!');
                    toggleNoticeForm();
                });

                window.deleteNotice = function(id) {
                    const idx = NOTICES.findIndex(n => n.id === id);
                    if (idx !== -1) {
                        NOTICES.splice(idx, 1);
                        document.getElementById('noticesList').innerHTML = renderAdminNotices();
                    }
                };
            }
        });
    </script>
</body>
</html>
