<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers | Admin Portal — KSS</title>
    <link rel="stylesheet" href="../portal.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
    <script src="../portal.js"></script>
    <script>
        buildPortalPage({
            role: 'admin',
            pageId: 'teachers',
            onReady: (main) => {
                let teacherCards = TEACHERS.map(t => `
                    <div class="card fade-in">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                            <div>
                                <h3 style="font-size:16px;">${t.name}</h3>
                                <span style="font-size:12px; color:var(--gold); font-weight:700;">${t.id} • ${t.subject}</span>
                            </div>
                            <span class="badge badge-subtle">${t.experience}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">
                            <div><i class='bx bx-award'></i> Qualification: ${t.qualification}</div>
                            <div><i class='bx bx-book'></i> Subjects: ${t.subjects.join(', ')}</div>
                            <div><i class='bx bx-building-house'></i> Classes: ${t.classes.map(c => getClassName(c)).join(', ')}</div>
                        </div>
                        <div style="font-size:11px; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.06); padding-top:8px;">
                            📞 ${t.phone} | ✉️ ${t.email}
                        </div>
                    </div>
                `).join('');

                main.innerHTML = `
                    <div class="top-header fade-in">
                        <div class="header-left">
                            <h1>Faculty & Teacher Directory</h1>
                            <p>Manage Teaching Staff & Department Assignments</p>
                        </div>
                    </div>

                    <div class="grid grid-2 fade-in">
                        ${teacherCards}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
